[[rule]]
id = "explore"
allow = ["model.infer", "fs.read", "process.execute"]
because = "An agent may read this repository and run its build."

[[rule]]
id = "local-model"
allow = ["network.connect"]
hosts = ["localhost", "127.0.0.1"]
because = "The model runs on this computer."

[[rule]]
id = "no-writes"
deny = ["fs.write", "fs.delete", "git.commit", "git.push"]
because = "This is a read-only look at a real repository."
