schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [".zig-cache", "zig-out"]

[task]
name = "sunlitmoon/zig-016-kvd"
version = "0.1.0"
description = "Port a Zig 0.15.2 TCP key-value server to Zig 0.16.0 without changing its protocol"
keywords = ["zig", "migration", "systems", "software-engineering"]
[[task.authors]]
